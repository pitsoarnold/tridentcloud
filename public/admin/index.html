<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trident Cloud — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #05152E;
    --navy-mid: #0A2240;
    --card: #0F2A4A;
    --card-hover: #143257;
    --red: #E63946;
    --red-hover: #c92a37;
    --red-soft: rgba(230,57,70,0.15);
    --azure: #3b82f6;
    --success: #10B981;
    --warning: #F59E0B;
    --violet: #a855f7;
    --text: #FFFFFF;
    --muted: rgba(255,255,255,0.65);
    --dim: rgba(255,255,255,0.4);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--navy); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .lucide { width: 18px; height: 18px; flex-shrink: 0; }

  /* ─── LOGIN ────────────────────────────────── */
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at top, rgba(230,57,70,0.08) 0%, transparent 60%), var(--navy); }
  .login-card { max-width: 440px; width: 100%; background: var(--navy-mid); border: 1px solid var(--border); border-radius: 20px; padding: 48px; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
  .login-logo { text-align: center; margin-bottom: 36px; }
  .login-logo .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .login-logo .brand span { color: var(--red); }
  .login-logo .sub { font-size: 11px; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; font-weight: 600; }
  .form-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .form-input { width: 100%; padding: 14px 16px; background: var(--navy); border: 1px solid var(--border-strong); border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; transition: all 0.15s; }
  .form-input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-primary { background: var(--red); color: white; }
  .btn-primary:hover { background: var(--red-hover); box-shadow: 0 4px 12px rgba(230,57,70,0.3); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
  .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: var(--muted); }
  .btn-sm { padding: 8px 14px; font-size: 12px; border-radius: 8px; }
  .btn-sm .lucide { width: 14px; height: 14px; }
  .btn-full { width: 100%; }
  .login-error { color: #f87171; font-size: 13px; text-align: center; margin-top: 16px; min-height: 18px; }

  /* ─── APP SHELL ────────────────────────────── */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 250px; background: #030E1F; border-right: 1px solid var(--border); padding: 24px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
  .sidebar-logo { margin-bottom: 28px; padding: 0 6px; }
  .sidebar-logo .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  .sidebar-logo .brand span { color: var(--red); }
  .sidebar-logo .sub { font-size: 9px; color: var(--dim); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 4px; font-weight: 700; }

  .nav-section { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); padding: 0 12px; margin: 20px 0 8px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; transition: all 0.15s; margin-bottom: 3px; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .nav-item.active { background: var(--red); color: white; box-shadow: 0 4px 12px rgba(230,57,70,0.25); }
  .nav-item .badge-count { margin-left: auto; background: rgba(255,255,255,0.12); color: var(--text); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; min-width: 22px; text-align: center; }
  .nav-item.active .badge-count { background: rgba(255,255,255,0.25); }

  .sidebar-footer { margin-top: auto; padding: 16px 6px 0; border-top: 1px solid var(--border); }
  .user-chip { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--red), #8b1e28); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
  .user-info { min-width: 0; flex: 1; }
  .user-email { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ─── MAIN CONTENT ─────────────────────────── */
  .main { flex: 1; overflow-x: hidden; }
  .topbar { padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(5,21,46,0.85); backdrop-filter: blur(12px); z-index: 20; }
  .topbar-greet { font-size: 15px; font-weight: 600; }
  .topbar-date { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .bell-wrap { position: relative; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--navy-mid); border: 1px solid var(--border); cursor: pointer; }
  .bell-wrap:hover { border-color: var(--border-strong); }
  .bell-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--navy-mid); }
  .content { padding: 32px; }

  /* ─── WELCOME BANNER ───────────────────────── */
  .welcome { background: linear-gradient(135deg, var(--red-soft) 0%, rgba(230,57,70,0.02) 60%), var(--navy-mid); border: 1px solid rgba(230,57,70,0.2); border-radius: 18px; padding: 30px 32px; margin-bottom: 24px; position: relative; overflow: hidden; }
  .welcome::before { content: ''; position: absolute; top: -60%; right: -10%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(230,57,70,0.18) 0%, transparent 65%); pointer-events: none; }
  .welcome-content { position: relative; z-index: 1; }
  .welcome h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .welcome p { font-size: 14px; color: var(--muted); max-width: 500px; line-height: 1.6; }

  /* ─── STAT CARDS ───────────────────────────── */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 14px; padding: 22px; transition: all 0.2s; }
  .stat-card:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .stat-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .stat-icon .lucide { width: 20px; height: 20px; }
  .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin-bottom: 10px; }
  .stat-value { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; margin-bottom: 8px; }
  .stat-delta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .stat-delta .lucide { width: 13px; height: 13px; }

  /* ─── CHARTS LAYOUT ────────────────────────── */
  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .panel { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .panel-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; }
  .panel-title { font-size: 15px; font-weight: 700; }
  .panel-sub { font-size: 12px; color: var(--dim); margin-top: 3px; }

  /* ─── BAR CHART ────────────────────────────── */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 170px; padding-top: 20px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .bar-value { font-size: 11px; color: var(--red); font-weight: 700; min-height: 14px; }
  .bar-wrap { width: 100%; height: 100%; display: flex; align-items: flex-end; }
  .bar { width: 100%; background: linear-gradient(180deg, var(--red) 0%, #8b1e28 100%); border-radius: 6px 6px 0 0; min-height: 3px; transition: all 0.3s; }
  .bar-wrap:hover .bar { opacity: 0.75; }
  .bar-label { font-size: 10px; color: var(--dim); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

  /* ─── DONUT ─────────────────────────────────── */
  .donut-wrap { display: flex; flex-direction: column; gap: 20px; }
  .donut { width: 150px; height: 150px; border-radius: 50%; position: relative; margin: 0 auto; }
  .donut-hole { position: absolute; inset: 22px; background: var(--navy-mid); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-hole .num { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .donut-hole .lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 2px; }
  .legend { display: grid; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; color: var(--muted); text-transform: capitalize; }
  .legend-val { font-weight: 700; }

  /* ─── ACTIVITY FEED ────────────────────────── */
  .activity { display: grid; gap: 2px; }
  .activity-item { display: flex; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); align-items: start; cursor: pointer; }
  .activity-item:last-child { border-bottom: none; }
  .activity-item:hover { background: rgba(255,255,255,0.02); }
  .activity-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--red-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .activity-icon .lucide { width: 16px; height: 16px; color: var(--red); }
  .activity-body { flex: 1; min-width: 0; }
  .activity-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .activity-meta { font-size: 11px; color: var(--dim); }
  .activity-time { font-size: 11px; color: var(--dim); white-space: nowrap; }

  /* ─── QUICK ACTIONS ────────────────────────── */
  .quick-actions { display: grid; gap: 10px; }
  .quick-action { display: flex; align-items: center; gap: 12px; padding: 13px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-family: inherit; color: var(--text); font-size: 13px; font-weight: 500; transition: all 0.15s; width: 100%; text-align: left; }
  .quick-action:hover { background: var(--card-hover); border-color: var(--border-strong); }
  .quick-action .lucide { color: var(--red); }

  /* ─── FILTERS ──────────────────────────────── */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-pill { padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; border: 1px solid var(--border-strong); color: var(--muted); font-family: inherit; transition: all 0.15s; }
  .filter-pill:hover { color: var(--text); border-color: var(--muted); }
  .filter-pill.active { background: var(--red); border-color: var(--red); color: white; }

  /* ─── TABLE ────────────────────────────────── */
  .table-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 14px 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); border-bottom: 1px solid var(--border); }
  td { padding: 16px 20px; font-size: 13px; border-bottom: 1px solid var(--border); }
  tbody tr { cursor: pointer; transition: background 0.15s; }
  tbody tr:hover td { background: rgba(255,255,255,0.025); }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: capitalize; letter-spacing: 0.3px; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.new { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .badge.contacted { background: rgba(59,130,246,0.15); color: #60a5fa; }
  .badge.qualified { background: rgba(168,85,247,0.15); color: #c084fc; }
  .badge.won { background: rgba(16,185,129,0.15); color: #34d399; }
  .badge.lost { background: rgba(156,163,175,0.15); color: #9ca3af; }

  .overdue { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: #f87171; font-weight: 700; margin-left: 6px; }
  .overdue .lucide { width: 12px; height: 12px; }

  .empty { text-align: center; padding: 80px 24px; color: var(--dim); }
  .empty .lucide { width: 48px; height: 48px; margin: 0 auto 16px; opacity: 0.3; display: block; }
  .empty-title { font-size: 15px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }

  /* ─── MODAL ────────────────────────────────── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--navy-mid); border: 1px solid var(--border-strong); border-radius: 18px; max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 26px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: start; }
  .modal-header h2 { font-size: 22px; font-weight: 700; margin-top: 8px; letter-spacing: -0.3px; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 28px; cursor: pointer; line-height: 1; padding: 0 8px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 24px 32px; }
  .modal-footer { padding: 20px 32px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; background: rgba(0,0,0,0.2); }
  .detail-row { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-bottom: 8px; }
  .detail-value { font-size: 14px; line-height: 1.6; }
  .detail-value a { color: var(--red); }
  .message-box { background: var(--navy); padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.7; color: var(--muted); margin-top: 8px; white-space: pre-wrap; }

  /* ─── TOAST ────────────────────────────────── */
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 10px; background: var(--navy-mid); border-left: 4px solid var(--red); box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(20px); transition: all 0.3s; z-index: 200; pointer-events: none; display: flex; align-items: center; gap: 10px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: #dc2626; }

  @media (max-width: 1000px) {
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar, .content { padding: 20px; }
  }
  @media (max-width: 600px) {
    .stat-grid { grid-template-columns: 1fr; }
    .welcome { padding: 24px; }
    .welcome h1 { font-size: 22px; }
    th, td { padding: 12px 14px; font-size: 12px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://lnulsuodpkboaouspqhp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_3Z3JR-jGwfh7wbVLgM9p-g_FUrlI5FQ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const SLA_HOURS = 24; // New enquiries older than this get flagged as overdue

// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════
const state = {
  user: null,
  view: 'dashboard', // 'dashboard' | 'enquiries'
  enquiries: [],
  filter: 'all',
  selected: null,
};

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════
function refreshIcons() {
  if (window.lucide && lucide.createIcons) setTimeout(() => lucide.createIcons(), 20);
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  const icon = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle-2' : 'info';
  t.innerHTML = '<i data-lucide="' + icon + '"></i><span>' + msg + '</span>';
  t.className = 'toast show' + (type ? ' ' + type : '');
  refreshIcons();
  setTimeout(() => t.className = 'toast', 3200);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function timeAgo(dateStr) {
  const diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return new Date(dateStr).toLocaleDateString('en-ZA');
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' });
}

function todayLabel() {
  return new Date().toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function isOverdue(enquiry) {
  if (enquiry.status !== 'new') return false;
  const hoursSince = (Date.now() - new Date(enquiry.created_at).getTime()) / 3600000;
  return hoursSince > SLA_HOURS;
}

// ════════════════════════════════════════════════════════════════════
// AUTH + DATA
// ════════════════════════════════════════════════════════════════════
async function checkAuth() {
  const { data } = await sb.auth.getSession();
  state.user = data.session?.user ?? null;
  render();
  if (state.user) await loadEnquiries();
}

async function signIn(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  state.user = data.user;
  await loadEnquiries();
}

async function signOut() {
  await sb.auth.signOut();
  state.user = null;
  state.enquiries = [];
  state.selected = null;
  state.view = 'dashboard';
  render();
}

async function loadEnquiries() {
  const { data, error } = await sb
    .from('contact_enquiries')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) { toast('Failed to load: ' + error.message, 'error'); return; }
  state.enquiries = data || [];
  render();
}

async function updateStatus(id, status) {
  const { error } = await sb.from('contact_enquiries').update({ status }).eq('id', id);
  if (error) { toast('Update failed: ' + error.message, 'error'); return; }
  toast('Status updated to ' + status, 'success');
  await loadEnquiries();
  closeModal();
}

async function deleteEnquiry(id) {
  if (!confirm('Delete this enquiry permanently? This cannot be undone.')) return;
  const { error } = await sb.from('contact_enquiries').delete().eq('id', id);
  if (error) { toast('Delete failed: ' + error.message, 'error'); return; }
  toast('Enquiry deleted', 'success');
  closeModal();
  await loadEnquiries();
}

// ════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!state.user) {
    app.innerHTML = renderLogin();
    attachLoginHandler();
  } else {
    app.innerHTML = renderApp();
  }
  refreshIcons();
}

function renderLogin() {
  return `
    <div class="login-shell">
      <div class="login-card">
        <div class="login-logo">
          <div class="brand">TRIDENT <span>CLOUD</span></div>
          <div class="sub">Admin Panel</div>
        </div>
        <form id="login-form">
          <div style="margin-bottom:16px;">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" name="email" required autocomplete="username" placeholder="admin@tridentcloud.co.za">
          </div>
          <div style="margin-bottom:24px;">
            <label class="form-label">Password</label>
            <input class="form-input" type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-full" type="submit">
            <i data-lucide="log-in"></i> Sign in
          </button>
        </form>
        <p id="login-error" class="login-error"></p>
      </div>
    </div>`;
}

function attachLoginHandler() {
  const form = document.getElementById('login-form');
  if (!form) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = form.querySelector('button');
    btn.disabled = true;
    btn.innerHTML = 'Signing in…';
    try {
      await signIn(fd.get('email'), fd.get('password'));
      render();
    } catch (err) {
      document.getElementById('login-error').textContent = err.message;
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in"></i> Sign in';
      refreshIcons();
    }
  });
}

function renderApp() {
  return `
    <div class="app">
      ${renderSidebar()}
      <main class="main">
        ${renderTopbar()}
        <div class="content">
          ${state.view === 'dashboard' ? renderDashboard() : renderEnquiriesView()}
        </div>
      </main>
    </div>
    <div id="modal-root"></div>`;
}

function renderSidebar() {
  const counts = {
    all: state.enquiries.length,
    new: state.enquiries.filter(e => e.status === 'new').length,
    inProgress: state.enquiries.filter(e => e.status === 'contacted' || e.status === 'qualified').length,
    won: state.enquiries.filter(e => e.status === 'won').length,
  };
  const initial = (state.user.email || 'A')[0].toUpperCase();
  return `
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="brand">TRIDENT <span>CLOUD</span></div>
        <div class="sub">Admin Panel</div>
      </div>

      <div class="nav-section">Overview</div>
      <button class="nav-item ${state.view === 'dashboard' ? 'active' : ''}" onclick="switchView('dashboard')">
        <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
      </button>

      <div class="nav-section">Manage</div>
      <button class="nav-item ${state.view === 'enquiries' && state.filter === 'all' ? 'active' : ''}" onclick="switchEnquiries('all')">
        <i data-lucide="inbox"></i><span>All Enquiries</span><span class="badge-count">${counts.all}</span>
      </button>
      <button class="nav-item ${state.view === 'enquiries' && state.filter === 'new' ? 'active' : ''}" onclick="switchEnquiries('new')">
        <i data-lucide="sparkles"></i><span>New</span><span class="badge-count">${counts.new}</span>
      </button>
      <button class="nav-item ${state.view === 'enquiries' && state.filter === 'contacted' ? 'active' : ''}" onclick="switchEnquiries('contacted')">
        <i data-lucide="phone"></i><span>Contacted</span>
      </button>
      <button class="nav-item ${state.view === 'enquiries' && state.filter === 'won' ? 'active' : ''}" onclick="switchEnquiries('won')">
        <i data-lucide="trophy"></i><span>Won</span><span class="badge-count">${counts.won}</span>
      </button>

      <div class="nav-section">System</div>
      <a class="nav-item" href="https://tridentcloud.co.za" target="_blank">
        <i data-lucide="external-link"></i><span>View site</span>
      </a>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar">${initial}</div>
          <div class="user-info">
            <div class="user-email">${escapeHtml(state.user.email)}</div>
          </div>
        </div>
        <button class="btn btn-outline btn-sm btn-full" onclick="signOut()">
          <i data-lucide="log-out"></i> Sign out
        </button>
      </div>
    </aside>`;
}

function renderTopbar() {
  const newCount = state.enquiries.filter(e => e.status === 'new').length;
  return `
    <div class="topbar">
      <div>
        <div class="topbar-greet">${getGreeting()}, Admin</div>
        <div class="topbar-date">${todayLabel()}</div>
      </div>
      <div class="topbar-actions">
        <div class="bell-wrap" onclick="switchEnquiries('new')" title="${newCount} new enquiries">
          <i data-lucide="bell" style="width:18px;height:18px;color:var(--muted);"></i>
          ${newCount > 0 ? '<span class="bell-dot"></span>' : ''}
        </div>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════
// DASHBOARD VIEW
// ════════════════════════════════════════════════════════════════════
function renderDashboard() {
  return `
    ${renderWelcomeBanner()}
    ${renderStatCards()}
    <div class="two-col">
      ${renderBarChartPanel()}
      ${renderDonutPanel()}
    </div>
    <div class="two-col">
      ${renderActivityPanel()}
      ${renderQuickActionsPanel()}
    </div>`;
}

function renderWelcomeBanner() {
  const newCount = state.enquiries.filter(e => e.status === 'new').length;
  const overdue = state.enquiries.filter(isOverdue).length;
  let message = "Here's what's happening with your enquiries today.";
  if (overdue > 0) message = `⚠ ${overdue} enquiry${overdue > 1 ? 'ies' : ''} have been waiting over ${SLA_HOURS}h for a response.`;
  else if (newCount > 0) message = `You have ${newCount} new enquiry${newCount > 1 ? 'ies' : ''} waiting for review.`;
  return `
    <div class="welcome">
      <div class="welcome-content">
        <h1>Welcome back 👋</h1>
        <p>${message}</p>
      </div>
    </div>`;
}

function renderStatCards() {
  const e = state.enquiries;
  const total = e.length;
  const newCount = e.filter(x => x.status === 'new').length;
  const inProgress = e.filter(x => x.status === 'contacted' || x.status === 'qualified').length;
  const won = e.filter(x => x.status === 'won').length;
  const wonValue = won * 4250; // avg first-year value (rough)

  return `
    <div class="stat-grid">
      ${statCard('Total Enquiries', total, 'inbox', '#E63946', 'All time')}
      ${statCard('New', newCount, 'sparkles', '#F59E0B', 'Awaiting response')}
      ${statCard('In Progress', inProgress, 'activity', '#3b82f6', 'Being worked')}
      ${statCard('Won', won, 'trophy', '#10B981', won > 0 ? `~R${wonValue.toLocaleString()} est.` : 'No wins yet')}
    </div>`;
}

function statCard(label, value, icon, color, sub) {
  return `<div class="stat-card">
    <div class="stat-icon" style="background:${color}22; border:1px solid ${color}44;">
      <i data-lucide="${icon}" style="color:${color};"></i>
    </div>
    <div class="stat-label">${label}</div>
    <div class="stat-value" style="color:${color};">${value}</div>
    <div class="stat-delta">${sub}</div>
  </div>`;
}

function renderBarChartPanel() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0, 0, 0, 0);
    const next = new Date(d);
    next.setDate(next.getDate() + 1);
    const count = state.enquiries.filter(e => {
      const t = new Date(e.created_at).getTime();
      return t >= d.getTime() && t < next.getTime();
    }).length;
    days.push({ label: d.toLocaleDateString('en', { weekday: 'short' }), count });
  }
  const max = Math.max(1, ...days.map(d => d.count));
  const total = days.reduce((s, d) => s + d.count, 0);
  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Enquiries — Last 7 Days</div>
          <div class="panel-sub">${total} total this week</div>
        </div>
        <i data-lucide="trending-up" style="color:var(--red);width:20px;height:20px;"></i>
      </div>
      <div class="bar-chart">
        ${days.map(d => `
          <div class="bar-col">
            <div class="bar-value">${d.count || ''}</div>
            <div class="bar-wrap"><div class="bar" style="height:${(d.count / max) * 100}%;"></div></div>
            <div class="bar-label">${d.label}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderDonutPanel() {
  const counts = {
    new: state.enquiries.filter(e => e.status === 'new').length,
    contacted: state.enquiries.filter(e => e.status === 'contacted').length,
    qualified: state.enquiries.filter(e => e.status === 'qualified').length,
    won: state.enquiries.filter(e => e.status === 'won').length,
    lost: state.enquiries.filter(e => e.status === 'lost').length,
  };
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const colors = { new: '#F59E0B', contacted: '#3b82f6', qualified: '#a855f7', won: '#10B981', lost: '#9ca3af' };

  if (total === 0) {
    return `
      <div class="panel">
        <div class="panel-header"><div><div class="panel-title">Pipeline</div><div class="panel-sub">Enquiry stages</div></div></div>
        <div style="text-align:center;padding:60px 0;color:var(--dim);font-size:13px;">No data yet</div>
      </div>`;
  }

  let cumulative = 0;
  const segments = [];
  for (const [key, val] of Object.entries(counts)) {
    if (val === 0) continue;
    const pct = (val / total) * 100;
    segments.push(`${colors[key]} ${cumulative}% ${cumulative + pct}%`);
    cumulative += pct;
  }

  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Pipeline</div>
          <div class="panel-sub">Enquiry stages</div>
        </div>
      </div>
      <div class="donut-wrap">
        <div class="donut" style="background: conic-gradient(${segments.join(', ')});">
          <div class="donut-hole">
            <div class="num">${total}</div>
            <div class="lbl">Total</div>
          </div>
        </div>
        <div class="legend">
          ${Object.entries(counts).filter(([k, v]) => v > 0).map(([k, v]) => `
            <div class="legend-item">
              <div class="legend-dot" style="background:${colors[k]};"></div>
              <div class="legend-label">${k}</div>
              <div class="legend-val">${v}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
}

function renderActivityPanel() {
  const recent = state.enquiries.slice(0, 5);
  if (recent.length === 0) {
    return `
      <div class="panel">
        <div class="panel-header"><div><div class="panel-title">Recent Activity</div><div class="panel-sub">Latest enquiries</div></div></div>
        <div style="text-align:center;padding:40px 0;color:var(--dim);font-size:13px;">No activity yet</div>
      </div>`;
  }
  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Recent Activity</div>
          <div class="panel-sub">Latest ${recent.length} enquiries</div>
        </div>
        <i data-lucide="activity" style="color:var(--dim);width:18px;height:18px;"></i>
      </div>
      <div class="activity">
        ${recent.map(e => `
          <div class="activity-item" onclick="openDetail('${e.id}')">
            <div class="activity-icon"><i data-lucide="mail"></i></div>
            <div class="activity-body">
              <div class="activity-title">${escapeHtml(e.name)} ${isOverdue(e) ? '<span class="overdue"><i data-lucide="alert-triangle"></i>OVERDUE</span>' : ''}</div>
              <div class="activity-meta">${escapeHtml(e.company || e.email)} · ${escapeHtml(e.system_count || 'system count N/A')}</div>
            </div>
            <div class="activity-time">${timeAgo(e.created_at)}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderQuickActionsPanel() {
  const newCount = state.enquiries.filter(e => e.status === 'new').length;
  const overdue = state.enquiries.filter(isOverdue).length;
  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Quick Actions</div>
          <div class="panel-sub">Common workflows</div>
        </div>
      </div>
      <div class="quick-actions">
        <button class="quick-action" onclick="switchEnquiries('new')">
          <i data-lucide="sparkles"></i>
          <span style="flex:1;">Review new enquiries</span>
          ${newCount > 0 ? `<span class="badge-count" style="background:var(--red-soft);color:var(--red);font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;">${newCount}</span>` : ''}
        </button>
        ${overdue > 0 ? `
        <button class="quick-action" onclick="switchEnquiries('new')" style="border-color:rgba(248,113,113,0.3);">
          <i data-lucide="alert-triangle" style="color:#f87171;"></i>
          <span style="flex:1;color:#f87171;">Overdue follow-ups</span>
          <span style="background:rgba(248,113,113,0.15);color:#f87171;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;">${overdue}</span>
        </button>` : ''}
        <button class="quick-action" onclick="switchEnquiries('won')">
          <i data-lucide="trophy"></i><span style="flex:1;">View won deals</span>
        </button>
        <button class="quick-action" onclick="loadEnquiries()">
          <i data-lucide="refresh-cw"></i><span style="flex:1;">Refresh data</span>
        </button>
        <a class="quick-action" href="https://tridentcloud.co.za" target="_blank">
          <i data-lucide="external-link"></i><span style="flex:1;">Open website</span>
        </a>
      </div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════
// ENQUIRIES VIEW
// ════════════════════════════════════════════════════════════════════
function renderEnquiriesView() {
  return `
    ${renderEnquiriesHeader()}
    ${renderStatCards()}
    ${renderFilters()}
    ${renderTable()}`;
}

function renderEnquiriesHeader() {
  const titles = { all: 'All Enquiries', new: 'New Enquiries', contacted: 'Contacted', qualified: 'Qualified', won: 'Won', lost: 'Lost' };
  return `
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:24px;">
      <div>
        <h1 style="font-size:26px;font-weight:700;letter-spacing:-0.5px;">${titles[state.filter]}</h1>
        <p style="font-size:13px;color:var(--dim);margin-top:4px;">${state.enquiries.length} total enquiries</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="switchView('dashboard')"><i data-lucide="arrow-left"></i> Back</button>
        <button class="btn btn-outline btn-sm" onclick="loadEnquiries()"><i data-lucide="refresh-cw"></i> Refresh</button>
      </div>
    </div>`;
}

function renderFilters() {
  const filters = ['all', 'new', 'contacted', 'qualified', 'won', 'lost'];
  return `
    <div class="filters">
      ${filters.map(f => `
        <button class="filter-pill ${state.filter === f ? 'active' : ''}" onclick="setFilter('${f}')">
          ${f.charAt(0).toUpperCase() + f.slice(1)}
        </button>
      `).join('')}
    </div>`;
}

function renderTable() {
  const filtered = state.filter === 'all'
    ? state.enquiries
    : state.enquiries.filter(e => e.status === state.filter);

  if (filtered.length === 0) {
    return `
      <div class="table-card">
        <div class="empty">
          <i data-lucide="inbox"></i>
          <div class="empty-title">No enquiries found</div>
          <div style="font-size:13px;">${state.filter === 'all' ? 'New submissions will appear here' : 'Try a different filter'}</div>
        </div>
      </div>`;
  }

  return `
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Received</th>
            <th>Name</th>
            <th>Company</th>
            <th>Systems</th>
            <th>Plan</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(e => `
            <tr onclick="openDetail('${e.id}')">
              <td style="color:var(--dim);font-size:12px;white-space:nowrap;">${timeAgo(e.created_at)}</td>
              <td style="font-weight:600;">${escapeHtml(e.name)} ${isOverdue(e) ? '<span class="overdue"><i data-lucide="alert-triangle"></i></span>' : ''}</td>
              <td style="color:var(--muted);">${escapeHtml(e.company) || '—'}</td>
              <td style="color:var(--muted);">${escapeHtml(e.system_count) || '—'}</td>
              <td style="color:var(--muted);">${escapeHtml(e.plan) || '—'}</td>
              <td><span class="badge ${e.status}">${e.status}</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════
// MODAL
// ════════════════════════════════════════════════════════════════════
function openDetail(id) {
  state.selected = state.enquiries.find(e => e.id === id);
  renderModal();
}

function renderModal() {
  const root = document.getElementById('modal-root');
  const e = state.selected;
  if (!e) { root.innerHTML = ''; return; }

  const actions = [
    { status: 'contacted', label: 'Mark Contacted', icon: 'phone' },
    { status: 'qualified', label: 'Mark Qualified', icon: 'check-circle' },
    { status: 'won', label: 'Mark Won', icon: 'trophy' },
    { status: 'lost', label: 'Mark Lost', icon: 'x-circle' },
  ].filter(a => a.status !== e.status);

  root.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div>
            <div style="font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;">
              Received ${fmtDate(e.created_at)} · ${timeAgo(e.created_at)}
              ${isOverdue(e) ? '<span class="overdue" style="margin-left:8px;"><i data-lucide="alert-triangle"></i>OVERDUE</span>' : ''}
            </div>
            <h2>${escapeHtml(e.name)}</h2>
            <div style="margin-top:12px;"><span class="badge ${e.status}">${e.status}</span></div>
          </div>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          ${detailRow('Email', `<a href="mailto:${escapeHtml(e.email)}">${escapeHtml(e.email)}</a>`)}
          ${e.company ? detailRow('Company', escapeHtml(e.company)) : ''}
          ${e.system_count ? detailRow('Systems', escapeHtml(e.system_count)) : ''}
          ${e.plan ? detailRow('Plan of interest', escapeHtml(e.plan)) : ''}
          ${detailRow('Message', `<div class="message-box">${escapeHtml(e.message)}</div>`)}
        </div>
        <div class="modal-footer">
          ${actions.map(a => `
            <button class="btn btn-outline btn-sm" onclick="updateStatus('${e.id}','${a.status}')">
              <i data-lucide="${a.icon}"></i> ${a.label}
            </button>
          `).join('')}
          <button class="btn btn-outline btn-sm" style="color:#f87171;border-color:rgba(248,113,113,0.3);margin-left:auto;" onclick="deleteEnquiry('${e.id}')">
            <i data-lucide="trash-2"></i> Delete
          </button>
        </div>
      </div>
    </div>`;
  refreshIcons();
}

function detailRow(label, value) {
  return `<div class="detail-row">
    <div class="detail-label">${label}</div>
    <div class="detail-value">${value}</div>
  </div>`;
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
  state.selected = null;
}

// ════════════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════════════
function switchView(view) {
  state.view = view;
  state.selected = null;
  render();
}

function switchEnquiries(filter) {
  state.view = 'enquiries';
  state.filter = filter;
  state.selected = null;
  render();
}

function setFilter(f) {
  state.filter = f;
  render();
}

// ════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════
checkAuth();
</script>
</body>
</html>
